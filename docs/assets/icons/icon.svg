<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Apple-style subtle gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1E24"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </linearGradient>
    
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C759"/>
      <stop offset="100%" stop-color="#30D158"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle container (Apple macOS icon shape) -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#shieldBg)" filter="url(#dropShadow)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="27.5" fill="none" stroke="url(#shieldBorder)" stroke-width="1.5"/>

  <!-- Minimalist Apple Shield emblem -->
  <path d="M64 26 C76 26 94 30 94 44 C94 72 68 89 64 96 C60 89 34 72 34 44 C34 30 52 26 64 26 Z" 
        fill="url(#blueGrad)" 
        fill-opacity="0.16" 
        stroke="url(#blueGrad)" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Inner Privacy Blur Wave / Eye Iris Geometry -->
  <path d="M46 54 C51 47 77 47 82 54 C85 58 85 64 82 68 C77 75 51 75 46 68 C43 64 43 58 46 54 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-opacity="0.9"/>

  <!-- Central Pupil / Shield Core -->
  <circle cx="64" cy="61" r="5" fill="#30D158" filter="url(#softGlow)"/>

  <!-- Subtle Frosted Blur Bars across the eye -->
  <line x1="42" y1="61" x2="52" y2="61" stroke="#34C759" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
  <line x1="76" y1="61" x2="86" y2="61" stroke="#34C759" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
